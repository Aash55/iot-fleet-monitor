$kind: http-request
name: 04 GET /devices/:id/readings?limit=5
url: "{{baseUrl}}/devices/{{device_id}}/readings?limit=5"
method: GET
headers:
  Authorization: Bearer {{token}}
queryParams:
  limit: "5"
scripts:
  - type: afterResponse
    code: |-
      pm.test("200 JSON", () => {
        pm.response.to.have.status(200);
        pm.expect(pm.response.headers.get("Content-Type")).to.include("application/json");
      });
      const readings = pm.response.json().readings;
      pm.test("readings is an array of at most 5", () => {
        pm.expect(readings).to.be.an("array");
        pm.expect(readings.length).to.be.at.most(5);
      });
      pm.test("every ts is a UTC ISO string ending in 'Z'", () => {
        for (const r of readings) {
          pm.expect(r.ts.endsWith("Z"), r.ts).to.eql(true);
          pm.expect(new Date(r.ts).toISOString()).to.eql(r.ts);
        }
      });
      pm.test("ordered oldest -> newest (for the chart)", () => {
        for (let i = 1; i < readings.length; i++) {
          pm.expect(new Date(readings[i].ts) >= new Date(readings[i - 1].ts), "index " + i).to.eql(true);
        }
      });
      pm.test("metrics has 10 features and never the label", () => {
        for (const r of readings) {
          pm.expect(Object.keys(r.metrics)).to.have.lengthOf(10);
          pm.expect(r.metrics).to.not.have.property("label");
        }
      });
    language: text/javascript
order: 4481740199267773

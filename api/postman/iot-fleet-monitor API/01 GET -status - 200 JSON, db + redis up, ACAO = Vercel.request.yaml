$kind: http-request
name: 01 GET /status -> 200 JSON, db + redis up, ACAO = Vercel
url: "{{baseUrl}}/status"
method: GET
headers:
  Origin: "{{origin}}"
scripts:
  - type: afterResponse
    code: |-
      let body = null;
      try { body = pm.response.json(); } catch (e) { body = null; }
      pm.test('status 200', () => pm.response.to.have.status(200));
      pm.test('content-type JSON', () => pm.expect(pm.response.headers.get('Content-Type') || '').to.include('application/json'));
      pm.test('body status = ok', () => pm.expect(body && body.status).to.eql('ok'));
      pm.test('db up + redis up', () => pm.expect(body && [body.db, body.redis]).to.eql(['up', 'up']));
      pm.test('ACAO = Vercel origin', () => pm.expect(pm.response.headers.get('Access-Control-Allow-Origin')).to.eql(pm.collectionVariables.get('origin')));
    language: text/javascript
order: 1790608748646
